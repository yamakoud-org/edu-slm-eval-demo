name: Deploy Edu-SLM Eval Demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (skip native CUDA ORT)
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Build Vite SPA
        run: npm run build

      - name: Fetch GGUF model from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/models/edu-slm-0.5b-gguf
          if gh release view v2.0-gguf-0.5b --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download v2.0-gguf-0.5b --repo "${{ github.repository }}" \
              --pattern "*.gguf" \
              --dir dist/models/edu-slm-0.5b-gguf
            ls -lh dist/models/edu-slm-0.5b-gguf/
            du -sh dist/
          else
            echo "::warning::Release v2.0-gguf-0.5b not found yet; deploying SPA without local GGUF bundle."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
